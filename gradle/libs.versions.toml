[versions]
kotlin = "2.4.0" # Used for the code of the rules
ktlint = "2.0.0-ALPHA-5"
kotlin-ktlint = "2.5.0-RC" # Match the dependencies published by ktlint
detekt = "2.0.0-alpha.6"
kotlin-detekt = "2.4.10" # Update only when detekt version updates
junit = "5.14.4"
junit-platform = "1.14.4"

# Compose BOM (for samples)
compose-bom = "2026.11.01"

[libraries]
ktrs = "io.github.hexay:ktrs:0.5.3"
ktlint-runner = { module = "io.github.ktlint.core:ktlint-cli", version.ref = "ktlint" }
ktlint-cli-ruleset-core = { module = "io.github.ktlint.core:ktlint-cli-ruleset-core", version.ref = "ktlint" }
ktlint-rule-engine = { module = "io.github.ktlint.core:ktlint-rule-engine", version.ref = "ktlint" }
ktlint-ruleset-standard = { module = "io.github.ktlint.core:ktlint-ruleset-standard", version.ref = "ktlint" }
ktlint-test = { module = "io.github.ktlint.core:ktlint-test", version.ref = "ktlint" }

detekt-core = { module = "dev.detekt:detekt-core", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-test-utils = { module = "dev.detekt:detekt-test-utils", version.ref = "detekt" }
detekt-psi-utils = { module = "dev.detekt:detekt-psi-utils", version.ref = "detekt" }

kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlin-compiler-detekt = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin-detekt" }
kotlin-ktlint-intellij = { module = "org.jetbrains.kotlin:kotlin-analysis-api-intellij-implementation-components", version.ref = "kotlin-ktlint" }

kaml = "com.charleskorn.kaml:kaml:0.104.0"

# Compose libraries (for samples - versions managed by BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit5-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj = "org.assertj:assertj-core:3.27.7"
konsist = "com.lemonappdev:konsist:0.18.1"
reflections = "org.reflections:reflections:0.10.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
mavenPublish = "com.vanniktech.maven.publish:0.37.0"
spotless = { id = "com.diffplug.spotless", version = "8.12.0" }
shadowJar = { id = "com.gradleup.shadow", version = "9.6.1" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
