name: Update release

on:
  push:
    branches:
      - main

jobs:
  update_draft_release:
    if: github.repository == 'mrmans0n/compose-rules'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        id: release_drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7

      - name: Update draft release with dependency matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse versions from libs.versions.toml
          DETEKT_VERSION=$(grep '^detekt = "' gradle/libs.versions.toml | sed 's/detekt = "\([^"]*\)".*/\1/')
          KOTLIN_DETEKT_VERSION=$(grep '^kotlin-detekt = "' gradle/libs.versions.toml | sed 's/kotlin-detekt = "\([^"]*\)".*/\1/')
          KTLINT_VERSION=$(grep '^ktlint = "' gradle/libs.versions.toml | sed 's/ktlint = "\([^"]*\)".*/\1/')
          KOTLIN_KTLINT_VERSION=$(grep '^kotlin-ktlint = "' gradle/libs.versions.toml | sed 's/kotlin-ktlint = "\([^"]*\)".*/\1/')

          echo "Detekt: $DETEKT_VERSION (Kotlin $KOTLIN_DETEKT_VERSION)"
          echo "Ktlint: $KTLINT_VERSION (Kotlin $KOTLIN_KTLINT_VERSION)"

          # Get current release body from the draft created by release-drafter
          RELEASE_ID="${{ steps.release_drafter.outputs.id }}"
          CURRENT_BODY=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID --jq '.body')

          MATRIX_START="<!-- compose-rules-dependency-matrix:start -->"
          MATRIX_END="<!-- compose-rules-dependency-matrix:end -->"

          # Create the dependency matrix table
          DEPENDENCY_TABLE=$(printf "%s\n## Dependency Matrix\n\n| linter | version | kotlin version |\n| ------ | ------- | -------------- |\n| detekt | %s | %s |\n| ktlint | %s | %s |\n%s" "$MATRIX_START" "$DETEKT_VERSION" "$KOTLIN_DETEKT_VERSION" "$KTLINT_VERSION" "$KOTLIN_KTLINT_VERSION" "$MATRIX_END")

          # Replace the generated matrix without dropping any manual release notes after it.
          NEW_BODY=$(CURRENT_BODY="$CURRENT_BODY" DEPENDENCY_TABLE="$DEPENDENCY_TABLE" python3 - <<'PY'
          import os
          import re

          body = os.environ["CURRENT_BODY"]
          table = os.environ["DEPENDENCY_TABLE"]
          start = "<!-- compose-rules-dependency-matrix:start -->"
          end = "<!-- compose-rules-dependency-matrix:end -->"

          marked_matrix = re.compile(f"{re.escape(start)}.*?{re.escape(end)}", re.DOTALL)
          legacy_matrix = re.compile(r"\n*## Dependency Matrix\n\n(?:\|[^\n]*\|\n?)+")

          if marked_matrix.search(body):
              new_body = marked_matrix.sub(table, body, count=1)
          elif legacy_matrix.search(body):
              new_body = legacy_matrix.sub(f"\n\n{table}", body, count=1)
          else:
              new_body = f"{body.rstrip()}\n\n{table}"

          print(new_body.strip())
          PY
          )

          # Update the draft release
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID \
            -X PATCH \
            -f body="$NEW_BODY"

          echo "Draft release updated with dependency matrix"
